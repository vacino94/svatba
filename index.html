
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Nela a Lukáš — Save the Date, 17. 7. 2027.">

  <title>Nela &amp; Lukáš — Save the Date</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f5ee;
      color: #292722;
    }

    main {
      width: 100%;
      max-width: 480px;
      min-height: 620px;
      padding: 48px 20px;
      border: 1px solid #d9cdb9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .save,
    .date {
      margin: 0;
      font-family: "Times New Roman", Georgia, serif;
      font-weight: normal;
      text-transform: uppercase;
    }

    .save {
      font-size: clamp(42px, 12vw, 64px);
      line-height: 1.05;
      letter-spacing: 0.04em;
    }

    .the-date {
      margin: 8px 0 0;
      font-family: Georgia, serif;
      font-size: 23px;
      font-style: italic;
      letter-spacing: 0.08em;
    }

    .flower {
      width: 116px;
      height: 116px;
      margin: 34px 0;
      border: 1px solid #c9b58f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ad9468;
      font-size: 58px;
      line-height: 1;
    }

    .names {
      margin: 0;
      font-family: "Times New Roman", Georgia, serif;
      font-size: clamp(24px, 7vw, 34px);
      font-weight: normal;
      letter-spacing: 0.06em;
    }

    .date {
      margin-top: 20px;
      font-size: 19px;
      letter-spacing: 0.12em;
    }

    .venue {
      margin: 12px 0 0;
      font-family: Georgia, serif;
      font-size: 17px;
      font-style: italic;
      color: #756956;
    }

    @media (max-width: 380px) {
      main {
        min-height: 560px;
        padding: 32px 12px;
      }

      .flower {
        margin: 26px 0;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1 class="save">Save</h1>
    <p class="the-date">the Date</p>

    <div class="flower" aria-hidden="true">✿</div>

    <p class="names">Nela &amp; Lukáš</p>
    <p class="date">17.07.2027</p>
    <p class="venue">Dřezická stodola</p>
  </main>
</body>
</html>
