
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Informace o naší svatbě.">
  <title>Naše svatba</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f3ed;
      color: #39352f;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 600px;
      padding: 48px 24px;
      border: 1px solid #d8cabb;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 28px 0 16px;
      font-size: clamp(38px, 9vw, 64px);
      font-weight: normal;
    }

    .date {
      font-size: 21px;
    }

    .message {
      margin-top: 36px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Zveme vás na naši svatbu</p>
    <h1>Nela &amp; Lukáš</h1>
    <p class="date">17. července 2027</p>
    <p class="message">
      Těšíme se, že tento den oslavíme společně s vámi.
    </p>
  </main>
</body>
</html>
